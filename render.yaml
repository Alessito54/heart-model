# Blueprint de Render para la practica de MLOps.
# Importar desde Render -> New -> Blueprint, apuntando a este repositorio.
#
# Un backend sirve las tres versiones del modelo (25 %, 50 % y 100 %). La imagen
# publicada por GitHub Actions contiene los tres artefactos, y el frontend elige
# con POST /predict?version=25|50|100.
services:
  # --- Backend: imagen publicada por GitHub Actions en Docker Hub ---------
  - type: web
    name: incidencia-model-api
    runtime: image
    plan: free
    image:
      # Sustituir <DOCKER_USER>/<MODEL_NAME> por la imagen real. El workflow
      # publica cada reentrenamiento con su propia etiqueta y mueve 'latest' a
      # esa misma imagen, asi que apuntar a :latest hace que un redespliegue
      # sirva siempre el modelo mas reciente.
      url: docker.io/<DOCKER_USER>/<MODEL_NAME>:latest
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      # Version servida cuando POST /predict no lleva el parametro ?version=
      - key: DEFAULT_MODEL_VERSION
        value: "100"
      # --- Reentrenamiento desde la interfaz ------------------------------
      # Token que debe presentar el frontend en la cabecera X-Retrain-Token.
      # Sin el, POST /retrain responde 503 y queda cerrado.
      - key: RETRAIN_TOKEN
        sync: false
      # PAT de GitHub con permiso de escritura en 'contents' del repositorio:
      # es lo que permite disparar el workflow (repository_dispatch).
      - key: GITHUB_TOKEN
        sync: false
      # Repositorio en formato usuario/repo.
      - key: GITHUB_REPOSITORY
        sync: false
      # Hosts permitidos para las URL de dataset del reentrenamiento.
      - key: RETRAIN_ALLOWED_HOSTS
        value: res.cloudinary.com

  # --- Frontend: sitio estatico construido con Vite -----------------------
  - type: web
    name: incidencia-model-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # URL publica del servicio incidencia-model-api. El frontend descubre las
      # versiones disponibles consultando GET /models.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
