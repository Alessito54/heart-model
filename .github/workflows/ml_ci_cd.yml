name: Modelops deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ml_ci_cd]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la imagen Docker (por defecto, el sha del commit)'
        required: false

# Permisos minimos: el workflow solo necesita leer el codigo del repositorio.
permissions:
  contents: read

# URLs de Cloudinary de las tres versiones del dataset. Se usan cuando el
# evento no trae client_payload (push, pull_request, workflow_dispatch). El
# endpoint POST /retrain de la API las reenvia en client_payload para que un
# reentrenamiento pueda apuntar a datasets nuevos sin tocar este archivo.
env:
  CLOUDINARY_25: https://res.cloudinary.com/dvkzq6c8a/raw/upload/v1793196213/incidencia_25_hmvvv6.csv
  CLOUDINARY_50: https://res.cloudinary.com/dvkzq6c8a/raw/upload/v1793196216/incidencia_50_hbf5b7.csv
  CLOUDINARY_100: https://res.cloudinary.com/dvkzq6c8a/raw/upload/v1793196218/incidencia_100_owtcfa.csv

jobs:
  # ---------------------------------------------------------------------------
  # 1) Entrenamiento: se ejecuta en push, pull_request y repository_dispatch.
  #    No accede a ningun secreto, por lo que es seguro para PRs externos.
  # ---------------------------------------------------------------------------
  train:
    name: Entrenar modelo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: ${{ matrix.python-version }}
          cache: pip

    - name: python version
      run: python --version

    - name: pip install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: preparar datasets (25 % / 50 % / 100 %)
      env:
        # Dataset de origen del SESNSP, con las categorias en texto. Si se envia,
        # se regeneran las tablas de consulta y las tres versiones.
        DATASET_URL: ${{ github.event.client_payload.dataseturl }}
        # Las tres versiones ya codificadas (columna id_delito). El payload gana
        # sobre las URLs de Cloudinary por defecto.
        DATASET_URL_25: ${{ github.event.client_payload.dataseturl_25 }}
        DATASET_URL_50: ${{ github.event.client_payload.dataseturl_50 }}
        DATASET_URL_100: ${{ github.event.client_payload.dataseturl_100 }}
      run: |
        set -euo pipefail
        mkdir -p data/versions

        # Solo se aceptan URLs https (la URL puede llevar token: nunca se imprime).
        require_https() {
          case "$1" in
            https://*) ;;
            *) echo "::error::$2 debe ser una URL https."; exit 1 ;;
          esac
        }

        fetch() {
          wget --no-verbose --tries=3 --timeout=60 -O "$2" "$1"
          if [ ! -s "$2" ]; then
            echo "::error::El dataset descargado en $2 esta vacio."
            exit 1
          fi
          # Cloudinary puede servir .csv.gz; se descomprime si hace falta.
          if head -c 2 "$2" | od -An -tx1 | grep -q '1f 8b'; then
            echo "  ($2 viene comprimido, descomprimiendo)"
            mv "$2" "$2.gz" && gunzip -f "$2.gz"
          fi
        }

        n_urls=0
        for u in "$DATASET_URL_25" "$DATASET_URL_50" "$DATASET_URL_100"; do
          [ -n "$u" ] && n_urls=$((n_urls + 1))
        done

        if [ -n "$DATASET_URL" ]; then
          # Caso 1: dataset de origen completo (categorias en texto). Se
          # regeneran las tablas de consulta y los tres subconjuntos.
          echo "Fuente: client_payload.dataseturl (se regeneran catalogos y subconjuntos)"
          require_https "$DATASET_URL" "dataseturl"
          fetch "$DATASET_URL" data/INM_estatal_dic25.csv
          python scripts/make_datasets.py --source data/INM_estatal_dic25.csv
        else
          # Caso 2: tres versiones ya codificadas. Del payload si viene; si no,
          # las URLs de Cloudinary definidas en env.
          if [ "$n_urls" -gt 0 ] && [ "$n_urls" -ne 3 ]; then
            echo "::error::Se recibieron $n_urls de 3 URLs. Indica dataseturl_25, dataseturl_50 y dataseturl_100, o usa solo dataseturl."
            exit 1
          fi
          if [ "$n_urls" -eq 3 ]; then
            echo "Fuente: client_payload.dataseturl_25 / _50 / _100"
            U25="$DATASET_URL_25"; U50="$DATASET_URL_50"; U100="$DATASET_URL_100"
          else
            echo "Fuente: URLs de Cloudinary por defecto (env del workflow)"
            U25="$CLOUDINARY_25"; U50="$CLOUDINARY_50"; U100="$CLOUDINARY_100"
          fi
          require_https "$U25"  "dataseturl_25"
          require_https "$U50"  "dataseturl_50"
          require_https "$U100" "dataseturl_100"
          fetch "$U25"  data/versions/incidencia_25.csv
          fetch "$U50"  data/versions/incidencia_50.csv
          fetch "$U100" data/versions/incidencia_100.csv
        fi

    - name: validar datasets
      run: |
        set -euo pipefail
        # Las tablas de consulta decodifican la columna id_delito y viven en el
        # repositorio; sin ellas el entrenamiento no puede reconstruir las
        # categorias.
        for f in data/catalogo_delitos.csv data/catalogo_entidades.csv; do
          [ -f "$f" ] || { echo "::error::Falta la tabla de consulta $f"; exit 1; }
          echo "$f -> $(( $(wc -l < "$f") - 1 )) filas"
        done

        for v in 25 50 100; do
          f="data/versions/incidencia_${v}.csv"
          [ -f "$f" ] || { echo "::error::Falta $f"; exit 1; }
          header=$(head -n 1 "$f")
          for col in id_delito incidencia_delictiva anio mes clave_ent; do
            echo "$header" | grep -q "$col" || {
              echo "::error::$f no contiene la columna '$col'. Encabezado: $header"
              exit 1; }
          done
          echo "$f -> $(( $(wc -l < "$f") - 1 )) registros"
        done

    - name: train models (25 % / 50 % / 100 %)
      run: python scripts/train_all_versions.py

    - name: test API
      run: python -m pytest tests/ -q

    - name: listar artefactos
      run: ls -la model/

    - name: upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        # catalog.json es obligatorio: la API lo carga al arrancar para validar
        # las entradas y poblar las listas del frontend.
        path: |
          model/incidencia-*.joblib
          model/metrics-*.json
          model/catalog.json
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) Publicacion de la imagen: NO se ejecuta en pull_request, de modo que un PR
  #    no confiable nunca obtiene acceso a los secretos de Docker Hub.
  # ---------------------------------------------------------------------------
  publish:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    needs: train
    if: github.event_name != 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: download model artifact
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: model

    - name: resolver etiqueta de imagen
      id: meta
      env:
        PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        INPUT_TAG: ${{ github.event.inputs.tag }}
        FALLBACK_SHA: ${{ github.sha }}
      run: |
        TAG="${PAYLOAD_SHA:-${INPUT_TAG:-$FALLBACK_SHA}}"
        # Etiquetas Docker validas: [A-Za-z0-9_.-], max 128 caracteres.
        if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
          echo "::error::La etiqueta de imagen no es valida: use letras, numeros, punto, guion y guion bajo."
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Etiqueta de imagen: $TAG"

    - name: validar secretos
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        MODEL_NAME: ${{ secrets.MODEL_NAME }}
      run: |
        missing=""
        [ -z "$DOCKER_USER" ] && missing="$missing DOCKER_USER"
        [ -z "$DOCKER_PASSWORD" ] && missing="$missing DOCKER_PASSWORD"
        [ -z "$MODEL_NAME" ] && missing="$missing MODEL_NAME"
        if [ -n "$missing" ]; then
          echo "::error::Faltan GitHub Secrets:$missing"
          exit 1
        fi

    - name: docker build
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        MODEL_NAME: ${{ secrets.MODEL_NAME }}
        TAG: ${{ steps.meta.outputs.tag }}
      # Cada reentrenamiento produce una imagen nueva con su propia etiqueta.
      # 'latest' se mueve a esa misma imagen para que Render pueda seguirla.
      run: |
        docker build -t "$DOCKER_USER/$MODEL_NAME:$TAG" \
                     -t "$DOCKER_USER/$MODEL_NAME:latest" .

    - name: show images
      run: docker images

    - name: smoke test de la imagen (las 3 versiones)
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        MODEL_NAME: ${{ secrets.MODEL_NAME }}
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        set -euo pipefail
        docker run -d --name incidencia-smoke -p 8000:80 "$DOCKER_USER/$MODEL_NAME:$TAG"
        trap 'docker rm -f incidencia-smoke > /dev/null 2>&1 || true' EXIT

        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8000/health > /dev/null; then break; fi
          sleep 2
        done
        curl -fsS http://localhost:8000/health
        echo

        echo "== versiones servidas =="
        curl -fsS http://localhost:8000/models
        echo

        echo "== catalogo =="
        curl -fsS http://localhost:8000/catalog | head -c 300
        echo

        PAYLOAD='{"anio":2025,"mes":6,"clave_ent":9,"bien_juridico_afectado":"El patrimonio","tipo_delito":"Robo","subtipo_delito":"Robo de vehículo automotor","modalidad":"Robo de coche de 4 ruedas Con violencia"}'
        preds=""
        for v in 25 50 100; do
          body=$(curl -fsS -X POST "http://localhost:8000/predict?version=$v" \
            -H 'Content-Type: application/json' -d "$PAYLOAD")
          echo "version $v -> $body"
          echo "$body" | grep -q "\"version\":\"$v\"" || {
            echo "::error::La version $v respondio con otra etiqueta de modelo."; exit 1; }
          preds="$preds$(echo "$body" | sed -E 's/.*"prediccion":([0-9.eE+-]+).*/\1/')\n"
        done

        # Tres modelos entrenados con volumenes distintos no deberian coincidir
        # exactamente: si lo hacen, es que se publico el mismo artefacto 3 veces.
        distinct=$(printf "$preds" | sort -u | wc -l)
        if [ "$distinct" -lt 2 ]; then
          echo "::error::Las 3 versiones devuelven la misma prediccion: probablemente se sobrescribieron los artefactos."
          exit 1
        fi
        echo "OK: $distinct salidas distintas para el mismo payload."

    - name: docker login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      # --password-stdin evita que la credencial quede en la linea de comandos.
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

    - name: docker push
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        MODEL_NAME: ${{ secrets.MODEL_NAME }}
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        docker push "$DOCKER_USER/$MODEL_NAME:$TAG"
        docker push "$DOCKER_USER/$MODEL_NAME:latest"

    - name: docker logout
      if: always()
      run: docker logout

    # Opcional: si existe el secreto RENDER_DEPLOY_HOOK, se avisa a Render para
    # que vuelva a desplegar y sirva la imagen recien publicada.
    - name: desplegar en Render
      env:
        HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      # El contexto 'secrets' no esta disponible en el 'if' de un step, asi que
      # la comprobacion va dentro del script: sin el secreto, se omite.
      run: |
        if [ -z "$HOOK" ]; then
          echo "Sin RENDER_DEPLOY_HOOK: se omite el redespliegue automatico."
          exit 0
        fi
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
        echo "Render deploy hook -> HTTP $code"
        [ "$code" -lt 400 ] || { echo "::error::Render rechazo el deploy hook."; exit 1; }

    - name: resumen
      env:
        MODEL_NAME: ${{ secrets.MODEL_NAME }}
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        {
          echo "### Imagen publicada"
          echo ""
          echo "- Evento: \`${{ github.event_name }}\`"
          echo "- Repositorio de imagen: \`<DOCKER_USER>/$MODEL_NAME\`"
          echo "- Etiqueta: \`$TAG\` (tambien \`latest\`)"
          echo "- Modelo: incidencia delictiva estatal, versiones 25 % / 50 % / 100 %"
        } >> "$GITHUB_STEP_SUMMARY"
