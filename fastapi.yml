#manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidenciamodel-deployment
spec:
  selector:
    matchLabels:
      app: incidenciamodel-server
  replicas: 3
  template:
    metadata:
      labels:
        app: incidenciamodel-server
    spec:
      containers:
      - name: incidenciamodel-container
        #image: gcr.io/tensorflow-serving/resnet 
        image: docker.io/<DOCKER_USER>/<MODEL_NAME>:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: incidenciamodel-service
  name: incidenciamodel-service
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: incidenciamodel-server
  type: LoadBalancer
